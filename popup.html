<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<style>
  body {
    margin: 0;
    width: 190px;
    padding: 18px 14px 10px;
    box-sizing: border-box;
    background: #1f1f1f;
    color: #fff;
    font-family: Tahoma, "Segoe UI", sans-serif;
    text-align: center;
  }
  .label {
    font-size: 15px;
    margin-bottom: 14px;
    letter-spacing: 1px;
    white-space: nowrap;
  }
  .switch {
    position: relative;
    display: inline-block;
    width: 54px;
    height: 28px;
  }
  .switch input { opacity: 0; width: 0; height: 0; }
  .slider {
    position: absolute;
    inset: 0;
    background: #555;
    border-radius: 28px;
    cursor: pointer;
    transition: background 0.2s;
  }
  .slider::before {
    content: "";
    position: absolute;
    height: 22px;
    width: 22px;
    left: 3px;
    top: 3px;
    background: #fff;
    border-radius: 50%;
    transition: transform 0.2s;
  }
  input:checked + .slider { background: #22c55e; }
  input:checked + .slider::before { transform: translateX(26px); }
  input:disabled + .slider { background: #333; cursor: not-allowed; }
  .status {
    font-size: 12px;
    color: #aaa;
    margin-top: 10px;
    min-height: 14px;
  }
  .credit {
    margin-top: 14px;
    font-size: 14px;
    color: #888;
    text-align: center;
  }
  .credit a {
    color: #22c55e;
    font-weight: bold;
    text-decoration: none;
  }
  .credit a:hover {
    text-decoration: underline;
  }
</style>
</head>
<body>
  <div class="label">یادگاری از سید!</div>
  <label class="switch">
    <input type="checkbox" id="toggle">
    <span class="slider"></span>
  </label>
  <div class="status" id="status"></div>
  <div class="credit">by <a href="https://github.com/sMohammad14" target="_blank" rel="noopener">sMohammad14</a></div>
  <script src="popup.js"></script>
</body>
</html>
